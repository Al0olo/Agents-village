[project]
name = "agent-village-harness"
version = "0.0.1"
description = "Python harness and reference implementations for Agent Village experiments"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
files = ["src"]
python_version = "3.10"

[tool.coverage.run]
source = ["agent_village"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
